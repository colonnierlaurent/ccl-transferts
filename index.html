<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCL — Demande de transfert</title>
<style>
:root{--y:#ffd500;--b:#171717;--bg:#f4f4f2;--line:#ddd}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#222}
header{background:var(--b);color:white;border-bottom:6px solid var(--y)}.head{max-width:1050px;margin:auto;padding:18px;display:flex;align-items:center;gap:16px}.logo{background:var(--y);color:#111;font-size:24px;font-weight:900;padding:10px 14px;border-radius:8px}
main{max-width:1000px;margin:28px auto;padding:0 18px 50px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px}h1{margin:0}.ref{font-weight:700;color:#555}
.card{background:#fff;border:1px solid #e3e3e3;border-radius:14px;padding:22px;margin:15px 0;box-shadow:0 3px 12px #0000000a}.card h2{font-size:16px;text-transform:uppercase;border-left:5px solid var(--y);padding-left:10px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;background:white;font-size:15px}textarea{min-height:90px}
.article{display:grid;grid-template-columns:1.1fr 2fr .7fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}.choice{display:flex;gap:18px;flex-wrap:wrap}.choice label{font-weight:400}.choice input{width:auto}
button{border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}.add{border:1px dashed #999;background:#fafafa}.remove{background:#eee}.actions{display:flex;justify-content:flex-end;gap:10px}.secondary{background:#e6e6e6}.primary{background:var(--y)}.note{font-size:12px;color:#6b7280;margin-top:10px}#message{display:none;background:#eef8ee;padding:14px;border-radius:8px;margin-top:15px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.article{grid-template-columns:1fr 1fr}.designation{grid-column:1/-1}.top{display:block}.ref{margin-top:8px}.actions{flex-direction:column}.actions button{width:100%}}
</style></head><body>
<header><div class="head"><div class="logo">CCL</div><div><strong>Transferts & Traçabilité</strong><div style="color:#bbb;font-size:13px;margin-top:4px">Prototype logistique</div></div></div></header>
<main><div class="top"><div><h1>Nouvelle demande de transfert</h1><div class="note">Les champs * sont obligatoires.</div></div><div class="ref" id="ref">Brouillon</div></div>
<form id="form">
<section class="card"><h2>Demandeur</h2><div class="grid"><div><label>Dépôt demandeur *</label><select required><option value="">Sélectionner…</option><option>Colomiers</option><option>Balma</option><option>Castres</option><option>Caraman</option><option>Moissac</option><option>Montauban</option><option>Saint-Gaudens</option></select></div><div><label>Nom du demandeur *</label><input required placeholder="Nom et prénom"></div></div></section>
<section class="card"><h2>Transfert</h2><div class="grid"><div><label>Dépôt expéditeur *</label><select required><option value="">Sélectionner…</option><option>Colomiers</option><option>Balma</option><option>Castres</option><option>Caraman</option><option>Moissac</option><option>Montauban</option><option>Saint-Gaudens</option></select></div><div><label>Dépôt destinataire *</label><select required><option value="">Sélectionner…</option><option>Colomiers</option><option>Balma</option><option>Castres</option><option>Caraman</option><option>Moissac</option><option>Montauban</option><option>Saint-Gaudens</option></select></div><div><label>Date souhaitée *</label><input type="date" required></div><div><label>Priorité</label><select><option>Standard</option><option>Urgent</option></select></div><div><label>Motif</label><select><option>Besoin client</option><option>Rééquilibrage stock</option><option>Chantier</option><option>Autre</option></select></div><div><label>N° commande / chantier / client</label><input placeholder="Facultatif"></div></div></section>
<section class="card"><h2>Marchandises</h2><div id="articles"><div class="article"><div><label>Référence *</label><input required placeholder="Référence"></div><div class="designation"><label>Désignation</label><input placeholder="Désignation article"></div><div><label>Quantité *</label><input type="number" min="1" required></div><div><label>Conditionnement</label><select><option>Palette</option><option>Colis</option><option>Longueurs</option><option>Vrac</option><option>Autre</option></select></div><button type="button" class="remove">×</button></div></div><button type="button" class="add" id="add">+ Ajouter un article</button></section>
<section class="card"><h2>Informations transport</h2><div class="grid"><div class="full"><label>Type de volume</label><div class="choice"><label><input type="radio" name="volume" checked> 1 palette</label><label><input type="radio" name="volume"> Plusieurs palettes</label><label><input type="radio" name="volume"> Longueurs</label><label><input type="radio" name="volume"> Colis / autre</label></div></div><div><label>Transfert partiel accepté ?</label><div class="choice"><label><input type="radio" name="partial" checked> Oui</label><label><input type="radio" name="partial"> Non</label></div></div><div><label>Pièce jointe</label><input type="file"></div><div class="full"><label>Commentaire</label><textarea placeholder="Précisions utiles pour la préparation ou le transport…"></textarea></div></div></section>
<div class="actions"><button type="button" class="secondary">Enregistrer le brouillon</button><button class="primary" type="submit">Envoyer la demande</button></div><div id="message"></div><div class="note">Prototype : aucune donnée n’est transmise ni stockée sur un serveur.</div></form></main>
<script>
const a=document.getElementById('articles');document.getElementById('add').onclick=()=>{const n=a.firstElementChild.cloneNode(true);n.querySelectorAll('input').forEach(i=>i.value='');a.appendChild(n)};a.addEventListener('click',e=>{if(e.target.classList.contains('remove')&&a.children.length>1)e.target.parentElement.remove()});document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=new Date(),id='TR-'+d.getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);document.getElementById('ref').textContent=id;const m=document.getElementById('message');m.style.display='block';m.innerHTML='<strong>Demande '+id+' créée en mode démonstration.</strong><br>Aucune donnée réelle n’a été envoyée.';scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
